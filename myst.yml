version: 1
project:
  id: energy-and-human-ambitions
  title: "Energy and Human Ambitions on a Finite Planet"
  short_title: "Energy and Human Ambitions"
  subtitle: "Assessing and Adapting to Planetary Limits"
  description: >-
    A web-native MyST edition of Tom Murphy's open textbook on energy, growth
    and the limits a finite planet imposes on human ambitions.
  authors:
    - name: Thomas W. Murphy, Jr.
      affiliations:
        - institution: University of California, San Diego
          city: San Diego
          state: California
          country: United States
  date: 2022-02-22
  license:
    content: CC-BY-NC-4.0
  open_access: true
  doi: 10.21221/S2978-0-578-86717-5
  github: QuadriviumPress/energyAndHumanAmbitions
  keywords:
    - energy
    - growth
    - climate change
    - renewable energy
    - sustainability
  numbering:
    heading_2: false
    heading_3: false
  math:
    # Kept for regenerated content that maps ♂ → \mars (see scripts/mathtext.py).
    '\mars': '\mathrm{Mars}'
  error_rules:
    # External URLs that return 403/404 to automated link checkers.
    - rule: link-resolves
      severity: ignore
      keys:
        - http://Climate.gov
        - https://arxiv.org/ftp/arxiv/papers/2010/2010.00982.pdf
        - https://doi.org/10.1002/we.2139
        - https://escholarship.org/uc/energy_ambitions
        - https://escholarship.org/uc/item/9js5291m
        - https://newsociety.com/books/e/eating-fossil-fuels
        - https://phys.org/news/2011-05-nuclear-power-world-energy.html
        - https://post.nyssa.org/nyssa-news/2010/04/moving-toward-a-steadystate-economy.html
        - https://science-edu.larc.nasa.gov/energy_budget/
        - https://spaceflight.nasa.gov/gallery/images/apollo/apollo8/html/as08-14-2383.html
        - https://www.forbes.com/sites/rrapier/2019/12/04/the-worlds-top-10-carbon-dioxide-emitters/?sh=55dd24ad2d04
        - https://www.iea.org/reports/electricity-information-overview
        - https://www.iea.org/reports/solar-pv
        - https://www.inscc.utah.edu/~tgarrett/Economics/Jevons_Paradox.html
        - https://www.irena.org/publications/2018/Jul/Renewable-Energy-Statistics-2018
        - https://www.myersbriggs.org/my-mbti-personality-type/my-mbti-results/how-frequent-is-my-type.htm
        - https://www.nasa.gov/centers/kennedy/about/information/shuttle_faq.html
        - https://www.ncdc.noaa.gov/sotc/global/201913%5C#gtemp
        - https://www.nei.org/resources/statistics/state-electricity-generation-fuel-shares
        - https://www.nrel.gov/docs/fy19osti/72399.pdf
        - https://www.nrel.gov/docs/legosti/old/5607.pdf
        - https://www.nrel.gov/gis/solar.html
        - https://www.nrel.gov/solar/solar-installed-system-cost.html
        - https://www.truity.com/personality-type
        - https://www.usgs.gov/special-topic/water-science-school/science/how-much-water-there-earth?
        - https://www.witpress.com/Secure/elibrary/papers/9781845642051/9781845642051003FU1.pdf
    - rule: doi-link-valid
      severity: ignore
      keys:
        - https://doi.org/10.1002/we.2139
        - https://doi.org/10.2495/978-1-84564-205-1/03
        - "10.1002/we.2139"
        - "10.2495/978-1-84564-205-1/03"
  toc:
    - file: index.md
    - file: front/preface.md
    - file: front/how-to-use-this-book.md
    - title: "Part I — Setting the Stage: Growth and Limitations"
      children:
        - file: chapters/ch-01-exponential-growth.md
        - file: chapters/ch-02-economic-growth-limits.md
        - file: chapters/ch-03-population.md
        - file: chapters/ch-04-space-colonization.md
    - title: "Part II — Energy and Fossil Fuels"
      children:
        - file: chapters/ch-05-energy-and-power-units.md
        - file: chapters/ch-06-putting-thermal-energy-to-work.md
        - file: chapters/ch-07-the-energy-landscape.md
        - file: chapters/ch-08-fossil-fuels.md
        - file: chapters/ch-09-climate-change.md
    - title: "Part III — Alternative Energy"
      children:
        - file: chapters/ch-10-renewable-overview.md
        - file: chapters/ch-11-hydroelectric-energy.md
        - file: chapters/ch-12-wind-energy.md
        - file: chapters/ch-13-solar-energy.md
        - file: chapters/ch-14-biological-energy.md
        - file: chapters/ch-15-nuclear-energy.md
        - file: chapters/ch-16-small-players.md
        - file: chapters/ch-17-comparison-of-alternatives.md
    - title: "Part IV — Going Forward"
      children:
        - file: chapters/ch-18-human-factors.md
        - file: chapters/ch-19-a-plan-might-be-welcome.md
        - file: chapters/ch-20-adaptation-strategies.md
    - title: "Closing"
      children:
        - file: back/epilogue.md
        - file: back/image-attributions.md
        - file: back/changes-and-corrections.md
    - title: "Appendices"
      children:
        - file: appendices/app-a-math-and-equations.md
        - file: appendices/app-b-chemistry-primer.md
        - file: appendices/app-c-selected-answers.md
        - file: appendices/app-d-alluring-tangents.md
    - title: "Reference"
      children:
        - file: back/bibliography.md
        - file: back/notation.md
        - file: back/glossary.md
